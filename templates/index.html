<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview Analyzer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg:       #0a0c10;
    --surface:  #111318;
    --border:   #1e2230;
    --accent:   #4f8ef7;
    --accent2:  #7c5cfc;
    --green:    #22d3a5;
    --orange:   #f7924f;
    --red:      #f74f6a;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --radius:   12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; }

  /* ── Layout ── */
  .app { display: grid; grid-template-rows: 64px 1fr; min-height: 100vh; }
  header { display: flex; align-items: center; padding: 0 32px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  header span { color: var(--accent); }
  .tag { margin-left: 12px; font-size: 11px; background: rgba(79,142,247,0.15); color: var(--accent); border: 1px solid rgba(79,142,247,0.3); padding: 2px 8px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; }

  main { display: grid; grid-template-columns: 380px 1fr; gap: 0; height: calc(100vh - 64px); overflow: hidden; }

  /* ── Upload Panel ── */
  .panel-left { border-right: 1px solid var(--border); padding: 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag-over { border-color: var(--accent); background: rgba(79,142,247,0.05); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 36px; margin-bottom: 12px; }
  .upload-zone p { color: var(--muted); font-size: 14px; }
  .upload-zone strong { color: var(--text); }

  .btn {
    width: 100%; padding: 12px; border-radius: var(--radius); border: none;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3b7de8; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

  .or-divider { text-align: center; color: var(--muted); font-size: 13px; position: relative; }
  .or-divider::before, .or-divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
  .or-divider::before { left: 0; }
  .or-divider::after { right: 0; }

  textarea {
    width: 100%; min-height: 120px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 14px;
    padding: 12px 14px; resize: vertical; outline: none; transition: border 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  /* ── Results Panel ── */
  .panel-right { overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 24px; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 16px; color: var(--muted); }
  .empty-state .big-icon { font-size: 64px; opacity: 0.3; }
  .empty-state p { font-size: 15px; }

  /* ── Score Cards ── */
  .scores-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (min-width: 1400px) { .scores-grid { grid-template-columns: repeat(4, 1fr); } }

  .score-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; display: flex; flex-direction: column; gap: 12px;
    transition: border 0.2s;
  }
  .score-card:hover { border-color: var(--accent); }
  .score-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
  .score-value { font-size: 42px; font-weight: 700; line-height: 1; font-family: 'JetBrains Mono', monospace; }
  .score-value.green { color: var(--green); }
  .score-value.blue  { color: var(--accent); }
  .score-value.purple { color: var(--accent2); }
  .score-value.orange { color: var(--orange); }
  .score-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(0.4,0,0.2,1); }

  /* ── Section Headers ── */
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }

  /* ── Recommendation Banner ── */
  .recommendation {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; display: flex; align-items: center; gap: 14px;
  }
  .rec-icon { font-size: 28px; }
  .rec-text { font-size: 15px; font-weight: 500; }
  .rec-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Emotion Chart ── */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .detail-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .detail-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }

  .emotion-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .emotion-label { width: 80px; color: var(--muted); }
  .emotion-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .emotion-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
  .emotion-pct { width: 38px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  /* ── Competency Pills ── */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid; }
  .pill.found { border-color: var(--green); color: var(--green); background: rgba(34,211,165,0.08); }
  .pill.missing { border-color: var(--border); color: var(--muted); }

  /* ── Transcript ── */
  .transcript-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; font-size: 13px; color: var(--muted); line-height: 1.7; max-height: 200px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; }

  /* ── Loading ── */
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 20px; }
  .spinner { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-steps { font-size: 13px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-align: center; }
  .loading-step { opacity: 0; animation: fadeIn 0.4s forwards; }
  .loading-step.active { color: var(--accent); opacity: 1; }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ── File Info ── */
  .file-info { background: rgba(79,142,247,0.08); border: 1px solid rgba(79,142,247,0.2); border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .file-info span { color: var(--muted); }

  scrollbar-width: thin;
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>AI Interview <span>Analyzer</span></h1>
    <div class="tag">v1.0 · Multimodal DL</div>
  </header>

  <main>
    <!-- Left Panel -->
    <div class="panel-left">
      <div>
        <div class="section-title" style="margin-bottom:12px">Upload Interview Video</div>
        <div class="upload-zone" id="dropZone">
          <input type="file" id="videoInput" accept="video/*">
          <div class="upload-icon">🎬</div>
          <strong>Drop video here or click to browse</strong>
          <p style="margin-top:6px">MP4, MOV, AVI · Max 500MB</p>
        </div>
      </div>

      <div id="fileInfo" style="display:none" class="file-info">
        📁 <span id="fileName">—</span>
      </div>

      <button class="btn btn-primary" id="analyzeBtn" disabled onclick="analyzeVideo()">
        ▶ &nbsp;Analyze Video
      </button>

      <div class="or-divider">or analyze text transcript</div>

      <div>
        <div class="section-title" style="margin-bottom:8px">Paste Transcript</div>
        <textarea id="transcriptInput" placeholder="Paste interview transcript here for text-only analysis..."></textarea>
      </div>

      <button class="btn btn-primary" id="textBtn" onclick="analyzeText()">
        ✦ &nbsp;Analyze Transcript
      </button>
    </div>

    <!-- Right Panel -->
    <div class="panel-right" id="resultsPanel">
      <div class="empty-state">
        <div class="big-icon">🎙️</div>
        <p>Upload a video or paste a transcript to begin analysis</p>
      </div>
    </div>
  </main>
</div>

<script>
// ── File Upload Handling ────────────────────────────────────────────────────
const videoInput   = document.getElementById('videoInput');
const analyzeBtn   = document.getElementById('analyzeBtn');
const fileInfo     = document.getElementById('fileInfo');
const fileName     = document.getElementById('fileName');
const dropZone     = document.getElementById('dropZone');
let selectedFile   = null;

videoInput.addEventListener('change', e => {
  selectedFile = e.target.files[0];
  if (selectedFile) {
    fileName.textContent = `${selectedFile.name} (${(selectedFile.size/1e6).toFixed(1)} MB)`;
    fileInfo.style.display = 'flex';
    analyzeBtn.disabled = false;
  }
});

['dragover','dragenter'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag-over'); }));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); }));
dropZone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('video/')) {
    selectedFile = file;
    fileName.textContent = `${file.name} (${(file.size/1e6).toFixed(1)} MB)`;
    fileInfo.style.display = 'flex';
    analyzeBtn.disabled = false;
  }
});

// ── Analyze Video ───────────────────────────────────────────────────────────
async function analyzeVideo() {
  if (!selectedFile) return;
  showLoading();
  const formData = new FormData();
  formData.append('video', selectedFile);
  try {
    const res = await fetch('/analyze', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderResults(data.full_report || data);
  } catch (err) {
    showError(err.message);
  }
}

// ── Analyze Text ────────────────────────────────────────────────────────────
async function analyzeText() {
  const transcript = document.getElementById('transcriptInput').value.trim();
  if (!transcript) return;
  showLoading();
  try {
    const res = await fetch('/analyze/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    // Wrap into report format
    const report = {
      transcript,
      final_scores: data.scores,
      nlp_analysis: data.nlp_analysis,
      facial_analysis: null,
      speech_analysis: null
    };
    renderResults(report);
  } catch (err) {
    showError(err.message);
  }
}

// ── Render Results ──────────────────────────────────────────────────────────
function renderResults(report) {
  const scores = report.final_scores || {};
  const nlp    = report.nlp_analysis || {};
  const facial = report.facial_analysis || {};
  const speech = report.speech_analysis || {};

  const recMap = {
    "Strong": { icon: "🏆", color: "var(--green)" },
    "Good":   { icon: "✅", color: "var(--accent)" },
    "Average":{ icon: "⚖️",  color: "var(--orange)" },
    "Below":  { icon: "⚠️",  color: "var(--red)" }
  };
  const recKey = Object.keys(recMap).find(k => (scores.recommendation || '').startsWith(k)) || "Average";
  const rec = recMap[recKey];

  const scoreColors = ['green','blue','purple','orange'];
  const scoreItems = [
    { label: 'Overall Suitability',    value: scores.overall_suitability || 0 },
    { label: 'Confidence Score',       value: scores.confidence_score    || 0 },
    { label: 'Communication Skill',    value: scores.communication_skill  || 0 },
    { label: 'Emotional Stability',    value: scores.emotional_stability   || 0 }
  ];

  // Emotion colors
  const eColors = { Happy:'#22d3a5', Neutral:'#4f8ef7', Calm:'#7c5cfc', Angry:'#f74f6a', Sad:'#64748b', Fear:'#f7924f', Surprise:'#fbbf24', Disgust:'#a3e635', Fearful:'#f74f6a' };

  const facialAgg  = facial.aggregate || {};
  const speechEmot = speech.emotion_probabilities || {};
  const competencies = nlp.competencies_detected || {};
  const quality = nlp.communication_quality || {};

  const panel = document.getElementById('resultsPanel');
  panel.innerHTML = `
    <!-- Recommendation Banner -->
    <div class="recommendation" style="border-color:${rec.color}22; background:${rec.color}0a">
      <div class="rec-icon">${rec.icon}</div>
      <div>
        <div class="rec-text" style="color:${rec.color}">${scores.recommendation || '—'}</div>
        <div class="rec-sub">Overall Score: ${scores.overall_suitability || 0}/100</div>
      </div>
    </div>

    <!-- Score Cards -->
    <div>
      <div class="section-title">Score Breakdown</div>
      <div class="scores-grid">
        ${scoreItems.map((s, i) => `
          <div class="score-card">
            <div class="score-label">${s.label}</div>
            <div class="score-value ${scoreColors[i]}">${s.value.toFixed(1)}</div>
            <div class="score-bar"><div class="score-bar-fill" style="width:${s.value}%; background:var(--${scoreColors[i] === 'blue' ? 'accent' : scoreColors[i] === 'purple' ? 'accent2' : scoreColors[i]})"></div></div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- Detail Grid -->
    <div class="detail-grid">

      <!-- Facial Emotions -->
      ${Object.keys(facialAgg).length ? `
      <div class="detail-card">
        <h3>😐 Facial Emotions</h3>
        ${Object.entries(facialAgg).sort((a,b)=>b[1]-a[1]).map(([em, pct]) => `
          <div class="emotion-bar-row">
            <div class="emotion-label">${em}</div>
            <div class="emotion-track"><div class="emotion-fill" style="width:${(pct*100).toFixed(1)}%; background:${eColors[em]||'var(--accent)'}"></div></div>
            <div class="emotion-pct">${(pct*100).toFixed(0)}%</div>
          </div>
        `).join('')}
      </div>` : '<div class="detail-card"><h3>😐 Facial Emotions</h3><p style="color:var(--muted);font-size:13px">No video analyzed</p></div>'}

      <!-- Speech Emotions -->
      ${Object.keys(speechEmot).length ? `
      <div class="detail-card">
        <h3>🎙️ Speech Emotions</h3>
        ${Object.entries(speechEmot).sort((a,b)=>b[1]-a[1]).map(([em, pct]) => `
          <div class="emotion-bar-row">
            <div class="emotion-label">${em}</div>
            <div class="emotion-track"><div class="emotion-fill" style="width:${(pct*100).toFixed(1)}%; background:${eColors[em]||'var(--accent2)'}"></div></div>
            <div class="emotion-pct">${(pct*100).toFixed(0)}%</div>
          </div>
        `).join('')}
      </div>` : ''}

      <!-- Competencies -->
      <div class="detail-card">
        <h3>⚡ Competencies Detected</h3>
        <div class="pills">
          ${Object.entries(competencies).map(([k,v]) => `<div class="pill ${v?'found':'missing'}">${v?'✓ ':''}${k}</div>`).join('')}
          ${Object.keys(competencies).length === 0 ? '<p style="color:var(--muted);font-size:13px">No transcript analyzed</p>' : ''}
        </div>
      </div>

      <!-- Communication Quality -->
      ${quality.total_words ? `
      <div class="detail-card">
        <h3>📝 Communication Quality</h3>
        ${[
          ['Words Spoken', quality.total_words],
          ['Unique Words', quality.unique_words],
          ['Vocab Richness', (quality.vocabulary_richness*100).toFixed(0)+'%'],
          ['Avg Sentence Length', quality.avg_sentence_length + ' words'],
          ['Filler Words', quality.filler_word_count]
        ].map(([l,v]) => `
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
            <span style="color:var(--muted)">${l}</span>
            <span style="font-family:'JetBrains Mono',monospace">${v}</span>
          </div>
        `).join('')}
      </div>` : ''}
    </div>

    <!-- Transcript -->
    ${report.transcript ? `
    <div>
      <div class="section-title">Transcript</div>
      <div class="transcript-box">${report.transcript}</div>
    </div>` : ''}
  `;
}

// ── Loading State ───────────────────────────────────────────────────────────
const STEPS = [
  'Extracting video frames...',
  'Detecting faces...',
  'Analyzing facial emotions...',
  'Extracting audio...',
  'Processing speech features...',
  'Transcribing speech...',
  'Running NLP analysis...',
  'Computing final scores...'
];

function showLoading() {
  const panel = document.getElementById('resultsPanel');
  panel.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-steps" id="stepsEl">
        ${STEPS.map((s,i) => `<div class="loading-step" id="step${i}" style="animation-delay:${i*0.8}s">${s}</div>`).join('')}
      </div>
    </div>
  `;
  // Animate step highlights
  STEPS.forEach((_,i) => setTimeout(() => {
    document.querySelectorAll('.loading-step').forEach(el => el.classList.remove('active'));
    document.getElementById('step'+i)?.classList.add('active');
  }, i*800));
}

function showError(msg) {
  document.getElementById('resultsPanel').innerHTML = `
    <div class="empty-state">
      <div style="font-size:48px">⚠️</div>
      <p style="color:var(--red)">${msg}</p>
      <p style="font-size:13px">Check that ffmpeg is installed and the video is valid.</p>
    </div>
  `;
}
</script>
</body>
</html>
